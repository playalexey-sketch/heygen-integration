<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes — локальный чат</title>
<style>
  :root {
    --bg:#0f1420; --panel:#1a2130; --panel2:#222c40; --line:#2e3a52;
    --text:#e8ecf4; --muted:#8b96ab; --accent:#4f8cff; --accent2:#6ee7b7;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; height:100vh; display:flex; flex-direction:column;
    background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
  }
  header {
    padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  header .logo {
    width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),#7c5cff);font-size:20px;
  }
  header h1 { margin:0; font-size:18px; }
  header .status { margin-left:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  header .dot { width:9px;height:9px;border-radius:50%; background:var(--danger); }
  header .dot.ok { background:var(--accent2); }
  select {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 10px; font-size:13px; outline:none;
  }
  #chat { flex:1; overflow-y:auto; padding:20px; }
  .msg { max-width:760px; margin:0 auto 16px; display:flex; gap:12px; }
  .msg .avatar {
    width:34px;height:34px;border-radius:8px; flex-shrink:0; display:grid;place-items:center; font-size:17px;
  }
  .msg.user { flex-direction:row-reverse; }
  .msg.user .avatar { background:var(--accent); }
  .msg.assistant .avatar { background:#2a3350; }
  .bubble {
    background:var(--panel2); border:1px solid var(--line); border-radius:14px;
    padding:11px 14px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; font-size:14.5px;
  }
  .msg.user .bubble { background:#26314a; border-color:var(--accent); }
  .msg .name { font-size:11px; color:var(--muted); margin-bottom:4px; }
  .cursor::after { content:"▋"; color:var(--accent2); animation:blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .warn {
    max-width:760px; margin:8px auto; padding:10px 14px; border-radius:10px;
    background:#33202a; border:1px solid #7c3a3a; font-size:13px; color:#f3c6c6;
  }
  form {
    display:flex; gap:10px; padding:14px 20px; background:var(--panel);
    border-top:1px solid var(--line);
  }
  textarea {
    flex:1; resize:none; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:11px 14px;
    font-size:14px; outline:none; font-family:inherit;
  }
  textarea:focus { border-color:var(--accent); }
  button {
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0b1020;
    border:none; border-radius:10px; padding:0 22px; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.small { padding:6px 12px; font-size:13px; }
  .hintbar {
    display:none; padding:10px 20px; background:var(--panel);
    border-top:1px solid var(--line); font-size:13px; color:var(--muted);
  }
  .hintbar.show { display:block; }
</style>
</head>
<body>
<header>
  <div class="logo">🧠</div>
  <h1>Локальный чат (Hermes / Qwen)</h1>
  <select id="model" title="Выберите модель"></select>
  <button id="install-btn" type="button" title="Установить выбранную модель" style="padding:6px 12px; font-size:13px;">⬇ Установить</button>
  <input id="custom-model" placeholder="или своё имя модели" style="width:170px; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; outline:none;">
  <div class="status"><span class="dot" id="dot"></span><span id="status">проверка…</span></div>
</header>

<div id="chat"></div>

<form id="form">
  <textarea id="input" rows="1" placeholder="Спросите что-нибудь…"></textarea>
  <button id="send" type="submit">➤</button>
</form>
<div class="hintbar" id="hintbar"></div>

<script>
const chatEl = document.getElementById('chat');
const formEl = document.getElementById('form');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelEl = document.getElementById('model');
const dotEl = document.getElementById('dot');
const statusEl = document.getElementById('status');
const installBtn = document.getElementById('install-btn');
const hintbarEl = document.getElementById('hintbar');
const customModelEl = document.getElementById('custom-model');

let history = [];

// Базовый путь API: standalone (hermes/chat_app.py) → /api/,
// встроенный в webui → /hermes/api/.
const API_BASE = location.pathname.startsWith('/hermes') ? '/hermes/api' : '/api';

function addMsg(role, text, streaming=false) {
  const m = document.createElement('div');
  m.className = 'msg ' + role;
  const icon = role === 'user' ? '🙂' : '🧠';
  const name = role === 'user' ? 'Вы' : 'Hermes';
  m.innerHTML = '<div class="avatar">' + icon + '</div>' +
    '<div><div class="name">' + name + '</div><div class="bubble">' + esc(text) + '</div></div>';
  chatEl.appendChild(m);
  if (streaming) {
    m.querySelector('.bubble').classList.add('cursor');
  }
  chatEl.scrollTop = chatEl.scrollHeight;
  return m;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showHint(msg) {
  hintbarEl.textContent = msg;
  hintbarEl.classList.add('show');
}

async function refreshModels() {
  try {
    const r = await fetch(API_BASE + '/models');
    const d = await r.json();
    // очистить
    modelEl.innerHTML = '';
    if (d.ollama_up) {
      dotEl.classList.add('ok');
      statusEl.textContent = 'Ollama работает';
    } else {
      dotEl.classList.remove('ok');
      statusEl.textContent = 'Ollama не запущен';
      showHint('Ollama не отвечает. Убедитесь, что сервис ollama запущен (docker compose).');
      return;
    }
    // установленные — сверху
    const installed = d.installed || [];
    installed.forEach(mm => addOption(mm, ' ✓ установлена'));
    // каталог — ниже (только не установленные)
    (d.catalog || []).forEach(mm => {
      if (!installed.includes(mm)) addOption(mm, ' (не установлена)');
    });
    if (!installed.length) {
      showHint('Нет установленных моделей. Выберите из списка и нажмите «⬇ Установить».');
    } else {
      showHint('');
      hintbarEl.classList.remove('show');
    }
  } catch(e) {
    statusEl.textContent = 'нет связи с сервером';
  }
}

function addOption(value, suffix) {
  const o = document.createElement('option');
  o.value = value;
  o.textContent = value + suffix;
  modelEl.appendChild(o);
}

// Установить выбранную модель (или введённую вручную)
installBtn.addEventListener('click', async () => {
  const custom = customModelEl.value.trim();
  const model = custom || modelEl.value;
  if (!model) return;
  installBtn.disabled = true;
  showHint('⏳ Устанавливаю ' + model + '… это может занять несколько минут.');
  try {
    const r = await fetch(API_BASE + '/pull', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({model: model})
    });
    const d = await r.json();
    if (d.ok) {
      showHint('✅ ' + model + ' установлена. Можете отправлять сообщения.');
      customModelEl.value = '';
      await refreshModels();
      modelEl.value = model;
    } else {
      showHint('❌ Ошибка установки: ' + (d.error || r.status));
    }
  } catch(e) {
    showHint('❌ Нет связи с сервером: ' + e);
  }
  installBtn.disabled = false;
});

customModelEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); installBtn.click(); }
});

(async function init() { await refreshModels(); })();

formEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;

  history.push({role:'user', content:text});
  addMsg('user', text);
  inputEl.value = '';
  sendBtn.disabled = true;

  const m = addMsg('assistant', '', true);
  const bubble = m.querySelector('.bubble');
  let acc = '';

  try {
    const resp = await fetch(API_BASE + '/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model: modelEl.value, messages: history })
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream:true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const line = buf.slice(0, idx).replace(/^data: /,'');
        buf = buf.slice(idx+2);
        if (!line) continue;
        let j; try { j = JSON.parse(line); } catch(_) { continue; }
        if (j.error) { acc += '\n[ошибка] ' + j.error; }
        else if (j.delta) { acc += j.delta; }
        bubble.textContent = acc;
        chatEl.scrollTop = chatEl.scrollHeight;
        if (j.done) break;
      }
    }
  } catch(err) {
    acc = '[нет связи с сервером] ' + err;
  }

  bubble.textContent = acc;
  bubble.classList.remove('cursor');
  history.push({role:'assistant', content:acc});
  sendBtn.disabled = false;
  inputEl.focus();
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); formEl.requestSubmit(); }
});
</script>
</body>
</html>
